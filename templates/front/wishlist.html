{% extends "front/index.html" %}

{% block title %}My Wishlist | E-Tech{% endblock %}

{% block content %}
<section class="wishlist-page py-5">
  <div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-heart me-2 text-danger"></i>My Wishlist</h2>
        <p class="text-muted">Saved products you love and want to purchase later.</p>
      </div>
      <a href="{{ url_for('product_list') }}" class="btn btn-outline-dark rounded-pill px-4">
        <i class="bi bi-plus-lg me-1"></i> Add More Items
      </a>
    </div>

    <!-- Container populated by wishlist.js -->
    <div id="wishlist-items-container">
      <div class="text-center py-5">
        <div class="spinner-border text-danger" role="status">
          <span class="visually-hidden">Loading wishlist...</span>
        </div>
      </div>
    </div>

  </div>
</section>
{% endblock %}
